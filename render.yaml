services:
  - type: web
    name: telegram-chatting-bot
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: TG_API_TOKEN
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: MONGO_URL
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: STT_MODEL
        value: whisper-large-v3
      - key: STT_LANGUAGE
        value: uk
      - key: VISION_MODEL
        value: qwen/qwen3.8-27b
      - key: MONGO_DB
        value: telegram-chatting-bot
      - key: BOT_TIMEZONE
        value: Europe/Kyiv
